<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PDF Merger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root {
    --bg: #f7f5f2;
    --card: #ffffff;
    --ink: #1f1b16;
    --muted: #6b6259;
    --accent: #c9622a;
    --accent-dark: #a34e1f;
    --border: #e5ded4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 40px 20px 80px;
    min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 700; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .dropzone {
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .dropzone.drag { border-color: var(--accent); background: #fdf3eb; }
  .dropzone p { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
  .dropzone .icon { font-size: 28px; }
  input[type=file] { display: none; }

  .section-label {
    margin: 26px 0 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .pagegrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .pagecard {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px;
    cursor: grab;
    position: relative;
    transition: box-shadow 0.1s, opacity 0.15s;
    user-select: none;
  }
  .pagecard.dragging { opacity: 0.4; }
  .pagecard.dragover { box-shadow: 0 0 0 2px var(--accent); }
  .pagecard img {
    width: 100%;
    display: block;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    pointer-events: none;
  }
  .pagecard .placeholder {
    width: 100%;
    aspect-ratio: 3/4;
    background: #efe9e0;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
  }
  .pagecard .meta {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
  }
  .pagecard .meta .label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pagecard button.remove {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(31,27,22,0.75);
    color: white;
    border: none;
    border-radius: 50%;
    width: 20px;
    height: 20px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }
  .pagecard .num {
    position: absolute;
    top: 4px;
    left: 4px;
    background: var(--accent);
    color: white;
    border-radius: 5px;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
  }

  .actions { margin-top: 26px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button.primary {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.primary:hover { background: var(--accent-dark); }
  button.primary:disabled { background: #d8d2c8; cursor: not-allowed; }
  button.secondary {
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    cursor: pointer;
    color: var(--ink);
  }
  button.secondary:hover { background: #f2ede6; }
  .status { margin-top: 14px; font-size: 13px; color: var(--muted); min-height: 18px; }
  .status.error { color: #b5473b; }
  .status.success { color: #2f7d4f; }
  .hint { font-size: 12px; color: var(--muted); margin-top: -2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PDF Merger</h1>
  <p class="sub">Combine PDFs and rearrange individual pages before exporting. Everything happens in your browser — files never leave your device.</p>

  <div class="dropzone" id="dropzone">
    <div class="icon">📄</div>
    <strong>Click to add PDFs</strong>
    <p>or drag and drop files here — you can add more at any time</p>
    <input type="file" id="fileInput" accept="application/pdf" multiple>
  </div>

  <div id="pageSection" style="display:none;">
    <div class="section-label">Pages (drag to reorder)</div>
    <p class="hint" id="pageCount"></p>
    <div class="pagegrid" id="pageGrid"></div>
  </div>

  <div class="actions">
    <button class="primary" id="mergeBtn" disabled>Export PDF</button>
    <button class="secondary" id="clearBtn">Clear all</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const { PDFDocument } = PDFLib;

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const pageSection = document.getElementById('pageSection');
const pageGrid = document.getElementById('pageGrid');
const pageCountEl = document.getElementById('pageCount');
const mergeBtn = document.getElementById('mergeBtn');
const clearBtn = document.getElementById('clearBtn');
const statusEl = document.getElementById('status');

// pages: array of { id, fileName, fileIdx, pageIndex (0-based within source), thumbUrl }
let pages = [];
let sources = []; // { name, bytes }
let pageIdCounter = 0;
let dragSrcId = null;

function setStatus(msg, type) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (type ? ' ' + type : '');
}

function updateUI() {
  pageSection.style.display = pages.length ? 'block' : 'none';
  pageCountEl.textContent = pages.length
    ? `${pages.length} page${pages.length === 1 ? '' : 's'} from ${sources.length} file${sources.length === 1 ? '' : 's'}. Drag cards to reorder, or click the ✕ to remove a page.`
    : '';
  mergeBtn.disabled = pages.length === 0;
  renderGrid();
}

function renderGrid() {
  pageGrid.innerHTML = '';
  pages.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'pagecard';
    card.draggable = true;
    card.dataset.id = p.id;

    const num = document.createElement('div');
    num.className = 'num';
    num.textContent = idx + 1;
    card.appendChild(num);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      pages = pages.filter(pg => pg.id !== p.id);
      updateUI();
    });
    card.appendChild(removeBtn);

    if (p.thumbUrl) {
      const img = document.createElement('img');
      img.src = p.thumbUrl;
      card.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'placeholder';
      ph.textContent = 'loading…';
      card.appendChild(ph);
    }

    const meta = document.createElement('div');
    meta.className = 'meta';
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = `${p.fileName} · p${p.pageIndex + 1}`;
    meta.appendChild(label);
    card.appendChild(meta);

    card.addEventListener('dragstart', (e) => {
      dragSrcId = p.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.pagecard.dragover').forEach(el => el.classList.remove('dragover'));
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      card.classList.add('dragover');
    });
    card.addEventListener('dragleave', () => {
      card.classList.remove('dragover');
    });
    card.addEventListener('drop', (e) => {
      e.preventDefault();
      card.classList.remove('dragover');
      if (dragSrcId === null || dragSrcId === p.id) return;
      const fromIdx = pages.findIndex(pg => pg.id === dragSrcId);
      const toIdx = pages.findIndex(pg => pg.id === p.id);
      if (fromIdx === -1 || toIdx === -1) return;
      const [moved] = pages.splice(fromIdx, 1);
      pages.splice(toIdx, 0, moved);
      dragSrcId = null;
      updateUI();
    });

    pageGrid.appendChild(card);
  });
}

async function renderThumbnail(pdfJsDoc, pageIndex) {
  const page = await pdfJsDoc.getPage(pageIndex + 1);
  const viewport = page.getViewport({ scale: 0.35 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL('image/png');
}

async function addFiles(fileArr) {
  const pdfFiles = Array.from(fileArr).filter(f => f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf'));
  if (pdfFiles.length === 0) {
    setStatus('Please choose PDF files only.', 'error');
    return;
  }
  setStatus('Loading pages…');
  for (const file of pdfFiles) {
    const bytes = await file.arrayBuffer();
    const bytesCopy = bytes.slice(0); // pristine copy for pdf-lib export later
    const sourceIdx = sources.length;
    sources.push({ name: file.name, bytes: bytesCopy });

    let pdfJsDoc;
    try {
      pdfJsDoc = await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise;
    } catch (err) {
      setStatus(`Couldn't read ${file.name}: ${err.message}`, 'error');
      continue;
    }
    const numPages = pdfJsDoc.numPages;
    const newPageEntries = [];
    for (let i = 0; i < numPages; i++) {
      const id = 'p' + (pageIdCounter++);
      newPageEntries.push({ id, fileName: file.name, fileIdx: sourceIdx, pageIndex: i, thumbUrl: null });
    }
    pages = pages.concat(newPageEntries);
    updateUI();

    for (const entry of newPageEntries) {
      try {
        const url = await renderThumbnail(pdfJsDoc, entry.pageIndex);
        entry.thumbUrl = url;
        const card = pageGrid.querySelector(`[data-id="${entry.id}"]`);
        if (card) {
          const existingImg = card.querySelector('img');
          const placeholder = card.querySelector('.placeholder');
          if (placeholder) {
            const img = document.createElement('img');
            img.src = url;
            placeholder.replaceWith(img);
          } else if (existingImg) {
            existingImg.src = url;
          }
        }
      } catch (err) {
        console.error('thumbnail render failed', err);
      }
    }
  }
  setStatus(pages.length ? '' : 'No pages loaded.');
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  addFiles(e.target.files);
  fileInput.value = '';
});
['dragenter', 'dragover'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.add('drag');
  });
});
['dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop', (e) => {
  addFiles(e.dataTransfer.files);
});

clearBtn.addEventListener('click', () => {
  pages = [];
  sources = [];
  updateUI();
  setStatus('');
});

mergeBtn.addEventListener('click', async () => {
  if (pages.length === 0) return;
  mergeBtn.disabled = true;
  setStatus('Building your PDF…');
  try {
    const outDoc = await PDFDocument.create();
    const loadedCache = {};
    for (const p of pages) {
      if (!loadedCache[p.fileIdx]) {
        loadedCache[p.fileIdx] = await PDFDocument.load(sources[p.fileIdx].bytes.slice(0));
      }
      const srcDoc = loadedCache[p.fileIdx];
      const [copiedPage] = await outDoc.copyPages(srcDoc, [p.pageIndex]);
      outDoc.addPage(copiedPage);
    }
    const outBytes = await outDoc.save();
    const blob = new Blob([outBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'merged.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setStatus(`Done — exported ${pages.length} pages to merged.pdf.`, 'success');
  } catch (err) {
    console.error(err);
    setStatus('Something went wrong: ' + err.message, 'error');
  } finally {
    mergeBtn.disabled = pages.length === 0;
  }
});
</script>
</body>
</html>
